name: build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: setup-msys2
        # org fork of msys2/setup-msys2 (enterprise policy blocks external actions)
        uses: qcom-eng-691/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: msys2-devel base-devel autotools cocom diffutils gcc gettext-devel libiconv-devel make mingw-w64-cross-crt mingw-w64-cross-gcc mingw-w64-cross-zlib perl zlib-devel xmlto docbook-xsl libzstd-devel

      - name: Build
        shell: msys2 {0}
        run: |
          (cd winsup && ./autogen.sh)
          # Build the MSYS2 runtime as the x86_64-pc-msys triple, NOT
          # x86_64-pc-cygwin. This fork renamed the upstream `*-*-cygwin*` cases
          # to `*-*-msys*` in both the top-level configure (which adds
          # target-winsup/target-newlib to target_configdirs) and
          # newlib/configure.host (posix_dir, xdr_dir, _MB_CAPABLE). Configuring
          # as -cygwin matches neither, so the build produces no runtime.
          # --disable-utils: skip cygcheck/strace (mingw-built, trip -Werror on
          # upstream warnings); only msys-2.0.dll is needed for the test artifact.
          ./configure --disable-dependency-tracking --with-msys2-runtime-commit="$GITHUB_SHA" \
            --build=x86_64-pc-msys --host=x86_64-pc-msys \
            --disable-utils \
            CFLAGS_FOR_TARGET="-g -O2 -D_MB_CAPABLE=1"
          make -j8

      - name: Install
        shell: msys2 {0}
        run: |
          make DESTDIR="$(pwd)"/_dest install

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: install
          path: _dest/

  generate-msys2-tests-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        # org fork of msys2/msys2-tests (enterprise policy blocks external actions)
        uses: qcom-eng-691/msys2-tests/gha-matrix-gen@main

  msys2-tests:
    needs: [build, generate-msys2-tests-matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-msys2-tests-matrix.outputs.matrix) }}

    name: msys2-tests ${{ matrix.msystem }}-${{ matrix.cc }}
    runs-on: ${{ matrix.runner }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FC: ${{ matrix.fc }}
    steps:
      - id: msys2
        # org fork of msys2/setup-msys2 (enterprise policy blocks external actions)
        uses: qcom-eng-691/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Add staging repo
        shell: msys2 {0}
        run: |
          sed -i '1s|^|[staging]\nServer = https://repo.msys2.org/staging/\nSigLevel = Never\n|' /etc/pacman.conf

      - name: Update using staging
        shell: pwsh
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          msys2 -c 'pacman --noconfirm -Suu'

      - name: Download msys2-runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: install
          path: ${{ steps.msys2.outputs.msys2-location }}

      - name: uname -a
        shell: msys2 {0}
        run: uname -a

      - name: Run tests
        # org fork of msys2/msys2-tests (enterprise policy blocks external actions)
        uses: qcom-eng-691/msys2-tests@main
